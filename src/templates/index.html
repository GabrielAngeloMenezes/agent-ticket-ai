<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agent Ticket AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #020617;
            border-right: 1px solid #1e293b;
            padding: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #111827;
            color: #cbd5e1;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 25px;
            border-bottom: 1px solid #1e293b;
            background: #111827;
            font-size: 18px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .time {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .input-area {
            padding: 20px;
            background: #111827;
            border-top: 1px solid #1e293b;
        }

        form {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            padding: 0 24px;
            border: none;
            border-radius: 14px;
            background: #38bdf8;
            color: #020617;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .empty {
            color: #94a3b8;
            text-align: center;
            margin-top: 60px;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="logo">Agent Ticket AI</div>

            <div class="menu-item">Chat</div>
            <div class="menu-item">Historico</div>
            <div class="menu-item">Memoria</div>
            <div class="menu-item">Configuracoes</div>
        </aside>

        <main class="main">

            <div class="header">
                Chat com IA
            </div>

            <div class="chat" id="chat">

                {% if historico %}

                    {% for item in historico %}

                        <div class="message user">
                            {{ item.ticket }}
                            <div class="time">Voce</div>
                        </div>

                        <div class="message ai">
                            {{ item.categoria }}
                            <div class="time">Agente IA</div>
                        </div>

                    {% endfor %}

                {% else %}

                    <div class="empty">
                        Comece uma conversa com o agente.
                    </div>

                {% endif %}

            </div>

            <div class="input-area">
                <form method="POST">
                    <input
                        type="text"
                        name="mensagem"
                        placeholder="Digite sua mensagem..."
                        required
                    >

                    <button type="submit">Enviar</button>
                </form>
            </div>

        </main>

    </div>

    <script>
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
    </script>

</body>
</html>
