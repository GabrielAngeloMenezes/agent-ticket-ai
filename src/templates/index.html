<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agent AI</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            margin:0;
            padding:0;
        }

        .topo{
            background:#111827;
            padding:20px;
            font-size:24px;
            font-weight:bold;
            border-bottom:1px solid #374151;
        }

        .chat{
            padding:20px;
            height:70vh;
            overflow-y:auto;
        }

        .msg-user{
            background:#2563eb;
            padding:15px;
            border-radius:15px;
            margin:10px 0;
            width:fit-content;
            max-width:70%;
            margin-left:auto;
        }

        .msg-ai{
            background:#1f2937;
            padding:15px;
            border-radius:15px;
            margin:10px 0;
            width:fit-content;
            max-width:70%;
        }

        .formulario{
            position:fixed;
            bottom:0;
            width:100%;
            background:#111827;
            padding:20px;
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#1f2937;
            color:white;
            font-size:16px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:15px 25px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>

<body>

    <div class="topo">
        ?? Agent Ticket AI
    </div>

    <div class="chat">

        {% for item in historico %}

            <div class="msg-user">
                {{ item.ticket }}
            </div>

            <div class="msg-ai">
                {{ item.categoria }}
            </div>

        {% endfor %}

    </div>

    <form method="POST" class="formulario">

        <input
            type="text"
            name="mensagem"
            placeholder="Digite sua mensagem..."
            required
        >

        <button type="submit">
            Enviar
        </button>

    </form>

</body>
</html>
