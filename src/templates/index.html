<!DOCTYPE html>
<html>
<head>
    <title>Agente IA Chat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        h1 {
            color: #38bdf8;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            border: 1px solid #475569;
            padding: 15px;
            font-size: 16px;
            background: #020617;
            color: white;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #020617;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .user-msg {
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .bot-msg {
            background: #064e3b;
            border-left: 4px solid #22c55e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .muted {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="card">
            <h1>Chat com Agente IA</h1>
            <p class="muted">Converse com o agente. As mensagens ficam salvas na nuvem.</p>

            <form method="POST">
                <textarea name="mensagem" placeholder="Digite sua mensagem..."></textarea>
                <button type="submit">Enviar</button>
            </form>
        </div>

        {% if resposta_agente %}
        <div class="card">
            <h2>Resposta do agente</h2>
            <div class="bot-msg">
                {{ resposta_agente }}
            </div>
        </div>
        {% endif %}

        <div class="card">
            <h2>Historico recente</h2>

            {% for item in historico %}
            <div class="user-msg">
                <strong>Voce:</strong> {{ item.ticket }}
            </div>

            <div class="bot-msg">
                <strong>Agente:</strong> {{ item.categoria }}
            </div>

            <p class="muted">{{ item.created_at }}</p>
            {% endfor %}
        </div>

    </div>
</body>
</html>
