<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ByteMaster AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #020617;
            padding: 20px;
        }

        .logo {
            color: #38bdf8;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .menu-item {
            background: #111827;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #111827;
            padding: 20px;
            border-bottom: 1px solid #334155;
            font-size: 20px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message-user {
            background: #2563eb;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            max-width: 70%;
            margin-left: auto;
        }

        .message-ai {
            background: #1e293b;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            max-width: 70%;
            border: 1px solid #334155;
        }

        .small {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 8px;
        }

        .form-area {
            background: #111827;
            padding: 20px;
            border-top: 1px solid #334155;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 16px 25px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="logo">ByteMaster AI</div>

        <div class="menu-item">Chat</div>
        <div class="menu-item">Historico</div>
        <div class="menu-item">Memoria</div>
        <div class="menu-item">Configuracoes</div>

        <br>

        <p>Usuario: {{ nome }}</p>
        <a href="/logout">Sair</a>
    </div>

    <div class="main">

        <div class="header">
            Chat com ByteMaster AI
        </div>

        <div class="chat">

            {% for item in historico %}

                <div class="message-user">
                    {{ item.ticket }}
                    <div class="small">Voce</div>
                </div>

                <div class="message-ai">
                    {{ item.categoria }}
                    <div class="small">ByteMaster AI</div>
                </div>

            {% endfor %}

        </div>

        <div class="form-area">
            <form method="POST">
                <input
                    type="text"
                    name="mensagem"
                    placeholder="Digite sua mensagem..."
                    required
                >

                <button type="submit">Enviar</button>
            </form>
        </div>

    </div>

</body>
</html>
