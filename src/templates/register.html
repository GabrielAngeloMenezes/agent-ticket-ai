<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
</head>

<body>

    <h1>Criar Conta</h1>

    {% if erro %}
        <p style="color:red;">
            {{ erro }}
        </p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="nome"
            placeholder="Nome"
            required
        >

        <br><br>

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <br><br>

        <button type="submit">
            Criar Conta
        </button>

    </form>

    <br>

    <a href="/login">
        Ja tenho conta
    </a>

</body>
</html>
